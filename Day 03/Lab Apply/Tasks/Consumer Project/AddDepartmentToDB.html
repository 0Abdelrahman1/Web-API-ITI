<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <title>Adding Department</title>
</head>
<body>
    <div class="container">
        <h1 class="text-center mt-5">Adding Department</h1>
        <form id="deptForm" class="mt-4">
            <div class="form-group">
                <label for="deptName">Department Name</label>
                <input type="text" class="form-control" id="deptName" name="Name" required>
            </div>
            <div class="form-group">
                <label for="deptLocation">Department Location</label>
                <input type="text" class="form-control" id="deptLocation" name="Location" required>
            </div>
            <div class="form-group">
                <label for="deptHead">Department Manager</label>
                <input type="text" class="form-control" id="deptHead" name="Manager" required>
            </div>
            <div class="form-group">
                <label for="deptPhoneNumber">Department Phone Number</label>
                <input type="text" class="form-control" id="deptPhoneNumber" name="PhoneNumber" required>
            </div>
            <button type="submit" class="btn btn-primary" id="submitBtn">Add Department</button>
            <div id="alertBox" class="mt-3"></div>
        </form>
    </div>

    <script>
        const form = document.getElementById('deptForm');
        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;

            const data = {
                Name: document.getElementById('deptName').value,
                Location: document.getElementById('deptLocation').value,
                Manager: document.getElementById('deptHead').value,
                PhoneNumber: document.getElementById('deptPhoneNumber').value
            };

            try {
                const response = await fetch('http://localhost:5159/api/Departments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const responseData = await response.json();

                if (response.ok) {
                    alertBox.innerHTML = '<div class="alert alert-success">Department added successfully!</div>';
                    form.reset();
                } else {
                    let errorMessage = '<div class="alert alert-danger"><strong>Error:</strong><ul>';
                    
                    if (responseData.errors) {
                        for (const field in responseData.errors) {
                            errorMessage += `<li>${field}: ${responseData.errors[field].join(', ')}</li>`;
                        }
                    } else if (responseData.message) {
                        errorMessage += `<li>${responseData.message}</li>`;
                    } else if (responseData.msg) {
                        errorMessage += `<li>${responseData.msg}</li>`;
                    }
                    
                    errorMessage += '</ul></div>';
                    alertBox.innerHTML = errorMessage;
                }
            } catch (error) {
                alertBox.innerHTML = `<div class="alert alert-danger">Network Error: ${error.message}</div>`;
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
